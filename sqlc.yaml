version: "2"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "internal/storage/postgres/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/storage/postgres/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"